# Builds TwinEars.exe from source on every push and pull request.
# Pushing a tag like v1.0.0 also publishes a GitHub Release with the exe and its SHA-256 checksum,
# so anyone can see the download was built from the public source.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (uses the C# compiler that ships with Windows)
        shell: cmd
        run: call build.cmd

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\TwinEars.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TwinEars.exe" | Out-File dist\TwinEars.exe.sha256 -Encoding ascii -NoNewline
          "SHA-256 of TwinEars.exe: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: TwinEars
          path: |
            dist/TwinEars.exe
            dist/TwinEars.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TwinEars
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash=$(cut -d' ' -f1 dist/TwinEars.exe.sha256)
          {
            echo "Download **TwinEars.exe** below. It's a single portable file: nothing to install."
            echo
            echo "SHA-256: \`$hash\`"
            echo
            echo "Built by GitHub Actions from the source code at this tag."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/TwinEars.exe dist/TwinEars.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "TwinEars $GITHUB_REF_NAME" \
            --notes-file notes.md
